summary: Stored XSS in admin warning messages via tax rate codes and feed values
details: >
  Warning messages shown on the tax rate grid were rendered as raw HTML, with tax rate codes and
  values from the online tax rate feed interpolated into them. A tax rate code or a feed row
  containing HTML or JavaScript was executed in the browser of an admin user viewing the tax rate
  grid. Version 2.0.0 renders the messages as escaped plain text and validates rows from the online
  feed before using them.
