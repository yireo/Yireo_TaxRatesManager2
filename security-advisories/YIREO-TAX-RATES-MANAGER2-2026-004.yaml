schema_version: "1.6.0"
id: YIREO-TAX-RATES-MANAGER2-2026-004
published: "2026-11-25T00:00:00Z"
modified: "2026-11-25T00:00:00Z"
aliases: []
summary: Server-side request forgery via the alternative feed URL
details: >
  The alternative feed URL configured in the module settings was fetched without validation, allowing
  any URL scheme and internal hosts, and parts of the response were included in exception messages
  shown in the admin. An admin user with access to the configuration could make the server request
  internal resources and read parts of the response. Version 2.0.0 only accepts https URLs that do
  not resolve to private or reserved IP ranges, checks this on save, before each request and on every
  redirect, uses timeouts and a redirect limit, and no longer echoes remote content in errors.
