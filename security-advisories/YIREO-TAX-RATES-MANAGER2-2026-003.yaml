aliases: []
summary: Cross-site request forgery on the Add, Fix and Clean tax rate actions
details: >
  The Add, Fix and Clean admin actions accepted GET requests and did not require a form key. When
  secret keys in admin URLs were disabled, a crafted link opened by a logged-in admin user could add
  or change tax rates or delete all tax rates. Version 2.0.0 only accepts POST requests with a valid
  form key for these actions and asks for confirmation before deleting all tax rates.
